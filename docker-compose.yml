services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campuspass
      POSTGRES_PASSWORD: campuspass
      POSTGRES_DB: campuspass
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuspass -d campuspass"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://campuspass:campuspass@postgres:5432/campuspass
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: campuspass-super-secret-jwt-key-2026-production!
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
      CLIENT_ORIGIN: http://localhost:5173
      NODE_ENV: production
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api/v1
    restart: unless-stopped
    ports: ["5173:5173"]
    depends_on:
      - backend

volumes:
  pgdata:
